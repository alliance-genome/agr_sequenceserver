:host: 0.0.0.0
:port: 4567
:databases_widget: tree
:options:
  :blastn:
    :default:
      :description: "Standard nucleotide BLAST (E-value: 1e-5, Max hits: 100)"
      :attributes:
        - "-task blastn"
        - "-evalue 1e-5"
        - "-max_target_seqs 100"
    :short-seq:
      :description: "Short sequences under 50bp (E-value: 0.1)"
      :attributes:
        - "-task blastn-short"
        - "-evalue 1e-1"
  :blastp:
    :default:
      :description: "Standard protein BLAST (E-value: 1e-5, Max hits: 100)"
      :attributes:
        - "-evalue 1e-5"
        - "-max_target_seqs 100"
  :blastx:
    :default:
      :description: "Translated nucleotide vs protein (E-value: 1e-5, Max hits: 100)"
      :attributes:
        - "-evalue 1e-5"
        - "-max_target_seqs 100"
  :tblastx:
    :default:
      :description: "Translated nucleotide vs translated nucleotide (E-value: 1e-5, Max hits: 100)"
      :attributes:
        - "-evalue 1e-5"
        - "-max_target_seqs 100"
  :tblastn:
    :default:
      :description: "Protein vs translated nucleotide (E-value: 1e-5, Max hits: 100)"
      :attributes:
        - "-evalue 1e-5"
        - "-max_target_seqs 100"
:num_threads: 1
:num_jobs: 1
# Job lifetime is in MINUTES, which job_remover.rb:16 multiplies by 60.
# 129600 is 90 days, raised from 43200, which was 30. A result URL is
# something people share, and 30 days was reaping them: of 1,243 jobs
# recovered from a September image, 316 crossed the limit within a day.
# At roughly 170 searches a day and 1.7 MB each, 90 days holds about 9,000
# jobs and 15 GB, against 67 GB free.
:job_lifetime: 129600
:database_dir: "/db"
