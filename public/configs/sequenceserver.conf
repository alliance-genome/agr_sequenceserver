:host: 0.0.0.0
:port: 4567
:databases_widget: tree
:options:
  :blastn:
    :default:
      - "-task blastn"
      - "-evalue 1e-5"
      - "-max_target_seqs 100"
    :short-seq:
      - "-task blastn-short"
      - "-evalue 1e-1"
  :blastp:
    :default:
      - "-evalue 1e-5"
      - "-max_target_seqs 100"
  :blastx:
    :default:
       - "-evalue 1e-5"
       - "-max_target_seqs 100"
  :tblastx:
    :default:
       - "-evalue 1e-5"
       - "-max_target_seqs 100"
  :tblastn:
    :default:
      - "-evalue 1e-5"
      - "-max_target_seqs 100"
:num_threads: 1
:num_jobs: 1
:job_lifetime: 43200
:database_dir: "/db"
